name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: jq --version
      - run: sudo apt-get install -y pandoc && pandoc --version | head -1
      - run: node --test plugin/tests/*.test.mjs
